<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnyDesk Web</title>
  <style>
    :root {
      --anydesk-red: #ef4444;
      --anydesk-red-hover: #dc2626;
      --anydesk-dark: #12141a;
      --toolbar-bg: rgba(23, 27, 38, 0.95);
      --card-bg: #1a1e29;
      --border: #2b3244;
      --text: #ffffff;
      --text-muted: #9ba3b4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--anydesk-dark);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* AnyDesk Floating Top Header */
    header {
      background-color: var(--toolbar-bg);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 8px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .anydesk-logo {
      position: relative;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .rhombus-back {
      position: absolute;
      width: 13px;
      height: 13px;
      background: #7f1d1d;
      transform: rotate(45deg) translate(-2px, -2px);
      border-radius: 2px;
    }
    .rhombus-front {
      position: absolute;
      width: 13px;
      height: 13px;
      background: var(--anydesk-red);
      transform: rotate(45deg) translate(2px, 2px);
      border-radius: 2px;
      box-shadow: 0 2px 6px rgba(239, 68, 68, 0.4);
    }

    .controls-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-field {
      background: #0f121a;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
      padding: 6px 12px;
      outline: none;
      font-family: monospace;
      font-weight: 700;
      transition: border-color 0.2s;
    }
    .input-field:focus {
      border-color: var(--anydesk-red);
    }

    input#userId {
      width: 140px;
      letter-spacing: 2px;
      text-align: center;
    }

    input#password {
      width: 110px;
      letter-spacing: 1px;
    }

    /* AnyDesk Toolbar Buttons */
    .btn {
      background: #252b3b;
      border: 1px solid var(--border);
      color: #fff;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn:hover:not(:disabled) {
      background: #2f374c;
      border-color: #3f4964;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-connect {
      background: var(--anydesk-red);
      border-color: var(--anydesk-red-hover);
      box-shadow: 0 2px 8px rgba(239, 68, 68, 0.35);
    }
    .btn-connect:hover:not(:disabled) {
      background: var(--anydesk-red-hover);
    }

    .btn-disconnect {
      background: #dc2626;
      border-color: #b91c1c;
    }

    /* In-Session Feature Toolbar */
    .session-toolbar {
      display: none;
      align-items: center;
      gap: 6px;
    }

    /* Main Screen Viewport */
    main {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }

    canvas#screenCanvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      cursor: default;
      display: block;
    }

    #overlayMessage {
      position: absolute;
      text-align: center;
      color: var(--text-muted);
      pointer-events: none;
      font-size: 1.1rem;
      max-width: 480px;
      line-height: 1.6;
    }

    /* In-Session Chat Drawer (AnyDesk Style) */
    .chat-drawer {
      position: fixed;
      top: 50px;
      right: -360px;
      width: 340px;
      bottom: 0;
      background: #171b26;
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: right 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 30;
      box-shadow: -4px 0 20px rgba(0,0,0,0.5);
    }
    .chat-drawer.open {
      right: 0;
    }

    .chat-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .chat-messages {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-msg {
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      max-width: 85%;
      word-wrap: break-word;
    }
    .chat-msg.remote {
      background: #252b3b;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }
    .chat-msg.me {
      background: var(--anydesk-red);
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }

    .chat-input-bar {
      padding: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 6px;
      background: #11141c;
    }
    .chat-input {
      flex: 1;
      background: #1a1e29;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      padding: 8px 12px;
      font-size: 0.85rem;
      outline: none;
    }

    /* Notification Banner */
    #errorBanner {
      display: none;
      position: fixed;
      top: 65px;
      background: rgba(220, 38, 38, 0.95);
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      z-index: 100;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="anydesk-logo">
        <div class="rhombus-back"></div>
        <div class="rhombus-front"></div>
      </div>
      <div>Any<span style="color: var(--anydesk-red);">Desk</span></div>
    </div>

    <!-- Login Form -->
    <div class="controls-wrapper" id="loginControls">
      <input type="text" class="input-field" id="userId" placeholder="Address" autocomplete="off" />
      <input type="password" class="input-field" id="password" placeholder="Password" autocomplete="off" />
      <button class="btn btn-connect" id="connectBtn">Connect</button>
    </div>

    <!-- In-Session Toolbar -->
    <div class="session-toolbar" id="sessionToolbar">
      <!-- Chat Toggle -->
      <button class="btn" id="toggleChatBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        Chat
      </button>

      <!-- Lock Workstation Action -->
      <button class="btn" id="actionLockBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        Lock PC
      </button>

      <!-- Fullscreen -->
      <button class="btn" id="fullscreenBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
      </button>

      <!-- Disconnect -->
      <button class="btn btn-disconnect" id="disconnectBtn">Disconnect</button>
    </div>
  </header>

  <div id="errorBanner"></div>

  <!-- Screen View -->
  <main id="mainContainer">
    <canvas id="screenCanvas" tabindex="0"></canvas>
    <div id="overlayMessage">
      Enter the <strong>AnyDesk Address</strong> and <strong>Password</strong> of the remote computer to connect.
    </div>
  </main>

  <!-- In-Session Chat Drawer -->
  <div class="chat-drawer" id="chatDrawer">
    <div class="chat-header">
      <span>AnyDesk In-Session Chat</span>
      <button class="btn" style="padding: 2px 8px;" id="closeChatBtn">✕</button>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="chat-msg remote">Welcome to AnyDesk session chat. Type your message below.</div>
    </div>
    <div class="chat-input-bar">
      <input type="text" class="chat-input" id="chatInput" placeholder="Write a message..." autocomplete="off" />
      <button class="btn btn-connect" id="sendChatBtn">Send</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('screenCanvas');
    const ctx = canvas.getContext('2d');
    const userInput = document.getElementById('userId');
    const passInput = document.getElementById('password');
    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const overlayMessage = document.getElementById('overlayMessage');
    const errorBanner = document.getElementById('errorBanner');
    const loginControls = document.getElementById('loginControls');
    const sessionToolbar = document.getElementById('sessionToolbar');
    const mainContainer = document.getElementById('mainContainer');
    const chatDrawer = document.getElementById('chatDrawer');
    const toggleChatBtn = document.getElementById('toggleChatBtn');
    const closeChatBtn = document.getElementById('closeChatBtn');
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const sendChatBtn = document.getElementById('sendChatBtn');
    const actionLockBtn = document.getElementById('actionLockBtn');

    let ws = null;
    let connected = false;
    let lastMouseMoveTime = 0;

    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.style.display = 'block';
      setTimeout(() => { errorBanner.style.display = 'none'; }, 4000);
    }

    // Auto format Address input with spaces (123 456 789)
    userInput.addEventListener('input', (e) => {
      let raw = e.target.value.replace(/\D/g, '').substring(0, 9);
      let formatted = '';
      for (let i = 0; i < raw.length; i++) {
        if (i > 0 && i % 3 === 0) formatted += ' ';
        formatted += raw[i];
      }
      e.target.value = formatted;
    });

    function connect() {
      const hostId = userInput.value.replace(/\s+/g, '').trim();
      const password = passInput.value.trim();

      if (!hostId || hostId.length < 6) {
        showError('Please enter a valid AnyDesk Address');
        return;
      }
      if (!password) {
        showError('Please enter the Unattended Access Password');
        return;
      }

      connectBtn.disabled = true;
      connectBtn.textContent = 'Connecting...';

      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}`;

      ws = new WebSocket(wsUrl);
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'join', hostId, password }));
      };

      ws.onmessage = async (event) => {
        // Binary JPEG screen frame
        if (event.data instanceof ArrayBuffer) {
          try {
            const blob = new Blob([event.data], { type: 'image/jpeg' });
            const bitmap = await createImageBitmap(blob);

            if (canvas.width !== bitmap.width || canvas.height !== bitmap.height) {
              canvas.width = bitmap.width;
              canvas.height = bitmap.height;
            }

            ctx.drawImage(bitmap, 0, 0);
            bitmap.close();

            if (overlayMessage.style.display !== 'none') {
              overlayMessage.style.display = 'none';
            }
          } catch (e) {}
          return;
        }

        // Control & Chat messages
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'joined') {
            connected = true;
            loginControls.style.display = 'none';
            sessionToolbar.style.display = 'flex';
            canvas.focus();
          } else if (msg.type === 'auth-error') {
            showError(msg.message);
            disconnect();
          } else if (msg.type === 'host-disconnected') {
            showError('Remote session ended by host.');
            disconnect();
          } else if (msg.type === 'chat-message') {
            addChatMessage(msg.text, 'remote');
            if (!chatDrawer.classList.contains('open')) {
              chatDrawer.classList.add('open');
            }
          }
        } catch (e) {}
      };

      ws.onclose = () => { disconnect(); };
      ws.onerror = () => { showError('Unable to reach AnyDesk Relay Server'); disconnect(); };
    }

    function disconnect() {
      connected = false;
      if (ws) {
        ws.close();
        ws = null;
      }
      connectBtn.disabled = false;
      connectBtn.textContent = 'Connect';
      loginControls.style.display = 'flex';
      sessionToolbar.style.display = 'none';
      chatDrawer.classList.remove('open');
      overlayMessage.style.display = 'block';
      overlayMessage.innerHTML = 'Session disconnected.<br>Enter AnyDesk Address and Password to reconnect.';
    }

    function sendEvent(obj) {
      if (connected && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(obj));
      }
    }

    function getNormalizedCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;
      return {
        x: Math.max(0, Math.min(1, x)),
        y: Math.max(0, Math.min(1, y))
      };
    }

    // Input handlers
    canvas.addEventListener('mousemove', (e) => {
      if (!connected) return;
      const now = performance.now();
      if (now - lastMouseMoveTime < 25) return;
      lastMouseMoveTime = now;
      const { x, y } = getNormalizedCoords(e);
      sendEvent({ type: 'mousemove', x, y });
    });

    canvas.addEventListener('mousedown', (e) => {
      if (!connected) return;
      canvas.focus();
      const { x, y } = getNormalizedCoords(e);
      sendEvent({ type: 'mousedown', button: e.button, x, y });
    });

    canvas.addEventListener('mouseup', (e) => {
      if (!connected) return;
      const { x, y } = getNormalizedCoords(e);
      sendEvent({ type: 'mouseup', button: e.button, x, y });
    });

    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    window.addEventListener('keydown', (e) => {
      if (!connected || document.activeElement === userInput || document.activeElement === passInput || document.activeElement === chatInput) return;
      if (['Tab', 'Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
        e.preventDefault();
      }
      sendEvent({ type: 'keydown', code: e.code, key: e.key });
    });

    window.addEventListener('keyup', (e) => {
      if (!connected || document.activeElement === userInput || document.activeElement === passInput || document.activeElement === chatInput) return;
      sendEvent({ type: 'keyup', code: e.code, key: e.key });
    });

    // Chat functionality
    function addChatMessage(text, sender) {
      const el = document.createElement('div');
      el.className = `chat-msg ${sender}`;
      el.textContent = text;
      chatMessages.appendChild(el);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function sendChat() {
      const text = chatInput.value.trim();
      if (!text || !connected) return;
      sendEvent({ type: 'chat-message', text });
      addChatMessage(text, 'me');
      chatInput.value = '';
    }

    toggleChatBtn.addEventListener('click', () => {
      chatDrawer.classList.toggle('open');
    });
    closeChatBtn.addEventListener('click', () => {
      chatDrawer.classList.remove('open');
    });
    sendChatBtn.addEventListener('click', sendChat);
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendChat();
    });

    // Remote Lock Action
    actionLockBtn.addEventListener('click', () => {
      if (confirm('Lock remote computer screen?')) {
        sendEvent({ type: 'remote-action', action: 'lock' });
      }
    });

    connectBtn.addEventListener('click', connect);
    disconnectBtn.addEventListener('click', disconnect);
    passInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') connect();
    });

    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        mainContainer.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen();
      }
    });
  </script>
</body>
</html>
